name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            asset: kite-linux-amd64
          - os: linux
            arch: arm64
            asset: kite-linux-arm64
          - os: darwin
            arch: amd64
            asset: kite-darwin-amd64
          - os: darwin
            arch: arm64
            asset: kite-darwin-arm64
          - os: windows
            arch: amd64
            asset: kite-windows-amd64.exe
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -o ${{ matrix.asset }} ./cmd/kite

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
